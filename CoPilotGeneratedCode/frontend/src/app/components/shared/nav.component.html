<header class="app-header">
  <div class="header-content">
    <h1>Nesi Timesheet</h1>
    <div class="header-actions">
      <span class="user-info">
        Welcome, {{ authService.currentUser()?.firstName }}
        <span class="role-badge">{{ authService.currentUser()?.role === 0 ? 'Admin' : authService.currentUser()?.role === 1 ? 'Manager' : 'Employee' }}</span>
      </span>
      <button class="btn btn-secondary" (click)="logout()">Logout</button>
    </div>
  </div>
</header>

<nav class="sidebar">
  <div class="nav-section">
    <h3>Main Menu</h3>
    <button 
      class="nav-item" 
      [class.active]="isActive('/dashboard')"
      (click)="navigateToDashboard()">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Dashboard</span>
    </button>
    <button 
      class="nav-item"
      [class.active]="isActive('/timesheets')"
      (click)="navigateToTimesheets()">
      <span class="nav-icon">⏱️</span>
      <span class="nav-label">Timesheets</span>
    </button>
    @if (authService.canApproveTimesheets()) {
      <button 
        class="nav-item"
        [class.active]="isActive('/timesheet-review')"
        (click)="navigateToTimesheetReview()">
        <span class="nav-icon">✅</span>
        <span class="nav-label">Review Timesheets</span>
      </button>
    }
  </div>

  <div class="nav-section">
    <h3>Business</h3>
    <button 
      class="nav-item"
      [class.active]="isActive('/quotes')"
      (click)="navigateToQuotes()">
      <span class="nav-icon">💼</span>
      <span class="nav-label">Quotes</span>
    </button>
    <button 
      class="nav-item"
      [class.active]="isActive('/work-orders')"
      (click)="navigateToWorkOrders()">
      <span class="nav-icon">🔧</span>
      <span class="nav-label">Work Orders</span>
    </button>
  </div>
</nav>
