<div class="card">
  <div class="card-header">
    <h5 class="mb-0">Upload Document</h5>
  </div>
  <div class="card-body">
    <form (ngSubmit)="uploadDocument()">
      <div class="mb-3">
        <label for="fileInput" class="form-label">Select File</label>
        <input
          type="file"
          class="form-control"
          id="fileInput"
          (change)="onFileSelected($event)"
          [disabled]="uploading"
          accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"
        />
        <div class="form-text">Max file size: 10MB</div>
      </div>

      <div class="mb-3">
        <label for="documentType" class="form-label">Document Type</label>
        <select
          class="form-select"
          id="documentType"
          [(ngModel)]="documentType"
          name="documentType"
          [disabled]="uploading"
        >
          <option *ngFor="let type of documentTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description (Optional)</label>
        <textarea
          class="form-control"
          id="description"
          rows="3"
          [(ngModel)]="description"
          name="description"
          [disabled]="uploading"
          placeholder="Add a description for this document..."
        ></textarea>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="selectedFile" class="mb-3">
        <div class="alert alert-info">
          <strong>Selected file:</strong> {{ selectedFile.name }}
          <span class="ms-2">({{ (selectedFile.size / 1024 / 1024).toFixed(2) }} MB)</span>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="!selectedFile || uploading"
        >
          <span *ngIf="uploading" class="spinner-border spinner-border-sm me-2"></span>
          {{ uploading ? 'Uploading...' : 'Upload Document' }}
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="resetForm()"
          [disabled]="uploading"
        >
          Clear
        </button>
      </div>
    </form>
  </div>
</div>
