<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Progress Tracking</h5>
    <button *ngIf="!editing" class="btn btn-sm btn-primary" (click)="toggleEditing()">
      <i class="bi bi-pencil"></i> Edit
    </button>
  </div>
  <div class="card-body">
    <!-- Progress Bar -->
    <div class="mb-4">
      <div class="d-flex justify-content-between mb-2">
        <span class="fw-bold">Overall Progress</span>
        <span class="badge bg-primary">{{ percentComplete }}%</span>
      </div>
      <div class="progress" style="height: 25px;">
        <div
          class="progress-bar progress-bar-striped"
          [class.progress-bar-animated]="percentComplete < 100"
          [class.bg-success]="percentComplete === 100"
          role="progressbar"
          [style.width.%]="percentComplete"
          [attr.aria-valuenow]="percentComplete"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          {{ percentComplete }}%
        </div>
      </div>
    </div>

    <!-- Milestones -->
    <h6 class="fw-bold mb-3">Milestones</h6>
    
    <div *ngIf="milestones.length === 0" class="text-muted text-center py-3">
      No milestones defined. Click "Edit" to add milestones.
    </div>

    <div class="milestone-list">
      <div
        *ngFor="let milestone of milestones; let i = index"
        class="milestone-item mb-2 p-3 border rounded"
        [class.completed]="milestone.complete"
      >
        <div class="d-flex align-items-center">
          <input
            type="checkbox"
            class="form-check-input me-3"
            [checked]="milestone.complete"
            (change)="toggleMilestone(i)"
            [disabled]="!editing"
          />
          
          <input
            *ngIf="editing"
            type="text"
            class="form-control flex-grow-1"
            [(ngModel)]="milestone.name"
            placeholder="Milestone name..."
          />
          
          <span *ngIf="!editing" class="flex-grow-1" [class.text-decoration-line-through]="milestone.complete">
            {{ milestone.name }}
          </span>
          
          <button
            *ngIf="editing"
            type="button"
            class="btn btn-sm btn-danger ms-2"
            (click)="removeMilestone(i)"
          >
            <i class="bi bi-trash"></i>
          </button>
          
          <i *ngIf="!editing && milestone.complete" class="bi bi-check-circle-fill text-success ms-2"></i>
        </div>
      </div>
    </div>

    <button
      *ngIf="editing"
      type="button"
      class="btn btn-sm btn-outline-primary mt-3"
      (click)="addMilestone()"
    >
      <i class="bi bi-plus-circle"></i> Add Milestone
    </button>

    <!-- Error Message -->
    <div *ngIf="error" class="alert alert-danger mt-3">
      {{ error }}
    </div>

    <!-- Action Buttons -->
    <div *ngIf="editing" class="d-flex gap-2 mt-3">
      <button
        type="button"
        class="btn btn-primary"
        (click)="saveProgress()"
        [disabled]="loading"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Saving...' : 'Save Changes' }}
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="toggleEditing()"
        [disabled]="loading"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
