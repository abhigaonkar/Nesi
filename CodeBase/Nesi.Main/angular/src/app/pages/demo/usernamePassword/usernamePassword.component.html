<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
  <form [formGroup]="userform" (ngSubmit)="onSubmit(userform.value)">

    <div class="ui-g-12">
      <div class="ui-g-12 ui-md-4">
        Username:
      </div>
      <div class="ui-g-12 ui-md-8">
        <input type="text" [readOnly]="true" pInputText formControlName="username" placeholder="Username">
        <nesi-fieldErrorDisplay [displayError]="isFieldInValid('username')" errorMsg="Username is required and at least 4 chars no invalid chars"></nesi-fieldErrorDisplay>
      </div>
    </div>
    <div class="ui-g-12">
      <div class="ui-g-12 ui-md-4">
        Password:
      </div>
      <div class="ui-g-12 ui-md-8">
        <input type="password" pInputText formControlName="password" placeholder="Password">
        <nesi-fieldErrorDisplay [displayError]="isFieldInValid('password')" errorMsg="Password is required"></nesi-fieldErrorDisplay>
      </div>
    </div>
    <div class="ui-g-12">
      <div class="ui-g-12 ui-md-4">
      </div>
      <div class="ui-g-12 ui-md-4">
        <button pButton type="submit" label="Submit" icon="fa-save"></button>
      </div>
      <div class="ui-g-12 ui-md-4">
        <button pButton type="reset" label="Reset" icon="fa-ban"></button>
      </div>
    </div>
  </form>
</div>
