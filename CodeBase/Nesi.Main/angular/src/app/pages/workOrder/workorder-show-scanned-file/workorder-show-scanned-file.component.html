<p-blockUI [blocked]="!trustedUrl" [target]="pblockableDiv">
  <i class="fas fa-spinner fa-spin fa-2x fa-fw blockui"></i>
</p-blockUI>
<blockable-div #pblockableDiv>
  <div class="ui-g-12" style="margin-left:10px" *ngIf="trustedUrl">
    <!-- <iframe [src]="trustedUrl" scrolling="no"></iframe> -->
    <object [data]="trustedUrl" type="application/pdf" width="100%" height="900px">
      <p>This browser does not support PDFs. Please download the PDF to view it:
        <a href="{{url}}">Download PDF</a>.</p>
    </object>
  </div>
</blockable-div>
