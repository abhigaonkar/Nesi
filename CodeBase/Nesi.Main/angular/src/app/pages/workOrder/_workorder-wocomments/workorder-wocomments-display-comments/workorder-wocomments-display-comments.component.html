<div class="ui-g-12 ui-g-nopad workorder_bucket_header">
  Comments ({{list && list.length || 0}})
</div>
<div class="ui-g-12 ui-g-nopad">
  <p-scrollPanel [style]="{'width': '100%', 'height': height + 'px', 'background-color': 'white'}" title="">
    <ng-container *ngIf="list && list.length>0">
      <ng-container *ngFor="let item of list; let i=index">
        {{item.name}} - {{item.woprogcomment_datetime}}
        <br/> {{item.woprogcomment_text}}
        <hr/>
      </ng-container>
    </ng-container>
    <ng-container *ngIf="!(list && list.length>0)">
      No Comments Entered.
    </ng-container>
  </p-scrollPanel>
</div>
