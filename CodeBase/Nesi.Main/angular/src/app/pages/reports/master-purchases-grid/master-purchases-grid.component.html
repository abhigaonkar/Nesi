<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
  <div class="ui-g-12">
    <nesi-breadcurmb [items]="[{label: 'Reports'},{label: 'Master Purchases Grid'}]"></nesi-breadcurmb>
  </div>
  <div class="ui-g-12">
    <nesi-datatable [id]='102' gridName="MasterPurchasesGrid" gridTitle="" refreshCache="true" (onRefresh)="loadDetail(true)"
      [callback]="masterPurchasesGridCallback" [dropdownOptions]="{poprog_apstatus: apStatusList}" (onDropDownChange)="dropDownForStatusReason($event)"
      (onEdit)="openEdit($event)">
    </nesi-datatable>
  </div>
</div>

<p-dialog [width]="cs.dialogWidth" [responsive]="true" [modal]="true" header="Editing {{entity && entity.poprog_id}}" [draggable]="true"
  [(visible)]="displayEdit" [positionTop]="50" (onHide)="exitFromEditor()">
  <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
    <master-purchases-editor [apStatusList]="apStatusList" [masterPurchase]="entity"  [editLink]="linkForEdit" (onExit)="exitFromEditor()">
    </master-purchases-editor>
  </div>
</p-dialog>
