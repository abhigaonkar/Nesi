<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
  <div class="ui-g-12">
    <nesi-breadcurmb [items]="[{label: 'Reports'},{label: 'Master Work Order Grid V2'}]"></nesi-breadcurmb>
  </div>
  <div class="ui-g-12">

    <nesi-datatable [id]='193' gridName="MasterWorkOrderV2" gridTitle="" [dropdownOptions]="{acting_ram: optionList}" 
      (onEdit)="openEdit($event)" (onDropDownChange)="activeRamUpdate($event)"
    [fixed_header_scroll]="210"
    [visible_business_type]="'S'"
      (onRefresh)="loadDetail()">
      <div class="bill-pro" style="display:block">
        <div class="check-color">
          <p>*Progress bill work orders are consolidated into the original `Job Cost` work order</p>
          <div class="service_call check-y">
            <p>Service Call</p>
          </div>
          <div class="on_hold check-p">
            <p>On Hold</p>
          </div>
        </div>
      </div>
    </nesi-datatable>
  </div>
</div>

<p-dialog [width]="cs.dialogWidth" [responsive]="true" [modal]="true" header="Editing {{entity && entity.woprog_id}}" [draggable]="true"
  [(visible)]="displayEdit" [positionTop]="50" (onHide)="exitFromEditor()">
  <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
    <masterWorkOrder-editor [masterWorkOrder]="entity" (onExit)="exitFromEditor()" [optionList]="optionList" [editLink]="link">
    </masterWorkOrder-editor>
  </div>
</p-dialog>
