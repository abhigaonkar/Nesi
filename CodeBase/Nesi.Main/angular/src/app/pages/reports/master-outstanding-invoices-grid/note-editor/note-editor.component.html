<p-blockUI [blocked]="submitting" [target]="pblockableDiv">
  <i class="fa fa-spinner fa-spin fa-3x fa-fw" style="position:absolute;top:25%;left:50%"></i>
</p-blockUI>
<blockable-div #pblockableDiv>
  <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
    <form [formGroup]="userform" (ngSubmit)="onSubmit(userform.value)">
      <div style="height: 400px">
        <div class="ui-grid">
          <div class="ui-grid-col-12">Notes
          </div>
        </div>
        <div class="ui-grid">
          <div class="ui-grid-col-12">
            <textarea pInputTextarea rows="30" cols="300" autoResize="autoResize" formControlName="note"></textarea>
          </div>
        </div>
        <div class="ui-g-12 ui-lg-2 ui-lg-offset-2">
          <button pButton type="Button" label="Cancel" icon="fa-close" (click)="cancel()"></button>
        </div>
        <div class="ui-g-12 ui-lg-2 ui-lg-offset-2">
          <button pButton type="Button" label="Save" icon="fa-save" (click)="addOrUpdateNote()"></button>
        </div>
      </div>
    </form>
  </div>
</blockable-div>
