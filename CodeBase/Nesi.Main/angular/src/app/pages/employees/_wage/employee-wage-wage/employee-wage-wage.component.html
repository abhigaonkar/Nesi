<p-blockUI [blocked]="submitting" [target]="pblockableDiv">
  <i class="fa fa-spinner fa-spin fa-3x fa-fw blockui"></i>
</p-blockUI>
<blockable-div #pblockableDiv>
  <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid smaller">
    <form [formGroup]="userform" (ngSubmit)="onSubmit(userform.value)">
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          ID:
        </div>
        <div class="ui-g-12 ui-lg-2 label_for_left_less">
          <input readonly pInputText maxlength="5" formControlName="id">
        </div>
      </div>
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          Effective Date:
        </div>
        <div class="ui-g-12 ui-lg-2 label_for_left_less">
          <p-calendar [style]="{'width': '100%'}" dateFormat="yy-mm-dd" showButtonBar="true" formControlName="date" placeholder="yyyy-mm-dd"
            showIcon="true"></p-calendar>
        </div>
        <div class="ui-g-12 ui-lg-6 label_for_left_less">
          <nesi-fieldErrorDisplay [displayError]="isFieldInValid('date')" [errorMsg]="' Effective Date is required.'"></nesi-fieldErrorDisplay>
        </div>
      </div>
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          Next Raise Date:
        </div>
        <div class="ui-g-12 ui-lg-2 label_for_left_less">
          <p-calendar [style]="{'width': '100%'}" dateFormat="yy-mm-dd" showButtonBar="true" formControlName="date_next_raise" placeholder="yyyy-mm-dd"
            showIcon="true"></p-calendar>
        </div>
        <div class="ui-g-12 ui-lg-6 label_for_left_less">
          <nesi-fieldErrorDisplay [displayError]="isFieldInValid('date_next_raise')" [errorMsg]="' Next Raise Date is required.'"></nesi-fieldErrorDisplay>
        </div>
      </div>
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          Comments:
        </div>
        <div class="ui-g-12 ui-lg-8 label_for_left_less">
          <textarea pInputTextarea [rows]="5" [cols]="25" formControlName="comment"></textarea>
        </div>
      </div>
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          Current Wage:
        </div>
        <div class="ui-g-12 ui-lg-2 label_for_left_less">
          <input pInputText type="number" step="0.01" min="0.01" maxlength="10" formControlName="current_wage">
        </div>
        <div class="ui-g-12 ui-lg-6 label_for_left_less">
          <nesi-fieldErrorDisplay [displayError]="isFieldInValid('current_wage')" [errorMsg]="' Current Wage is required.'"></nesi-fieldErrorDisplay>
        </div>
      </div>
      <div class="ui-g-12 ui-g-nopad">
          <div class="ui-g-12 ui-lg-2 label_for_right">
            Active:
          </div>
          <div class="ui-g-12 ui-lg-2 label_for_left_less">
              <p-checkbox binary="true" formControlName="active"></p-checkbox>
          </div>
          <div class="ui-g-12 ui-lg-6 label_for_left_less">
             
          </div>
        </div>
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          Bonus Type:
        </div>
        <div class="ui-g-12 ui-lg-2 label_for_left_less">
          <p-dropdown [filter]="false" maxlength="50" placeholder="Select bonus type" [style]="{'width':'100%'}" [options]="bonusTypeList"
            formControlName="bonus_type"></p-dropdown>
        </div>
      </div>
      <div class="ui-g-12 ui-g-nopad">
        <div class="ui-g-12 ui-lg-2 label_for_right">
          Bonus Amount:
        </div>
        <div class="ui-g-11 ui-lg-2 label_for_left_less">
          <input pInputText type="number" step="0.01" maxlength="10" formControlName="bonus_amount">
        </div>
        <div class="ui-g-1 ui-lg-1 label_for_left">
          %
        </div>
      </div>
      <div class="ui-g-12">
        <div class="ui-g-12 ui-lg-2 ui-lg-offset-2">
          <button pButton type="submit" label="Save" icon="fa-save"></button>
        </div>
        <div class="ui-g-12 ui-lg-2">
          <button pButton  class="ui-button-secondary" type="button" label="Close" icon="fa-times-circle" (click)="close.emit()"></button>
        </div>
      </div>
    </form>
  </div>
</blockable-div>
