
<div class="ContentSideSections Implementation">
 <div class="ui-widget-header" style="padding:4px 10px;border-bottom: 0 none">
    <i class="fa fa-search" style="margin:4px 4px 0 0"></i>
    <input #gb type="text" pInputText placeholder="Global Filter" class="ui-md-3">
</div>
  <p-dataTable [value]="items"
        selectionMode="single"
        reorderableColumns="true"
        [paginator]="true"
        [pageLinks]="5"
        [rowsPerPageOptions]="[20,50]"
        [rows]="20"
        [totalRecords]="totalRecords"
        [responsive]="true"
        [globalFilter]="gb"
        resizableColumns="true"
        rowHover="true"
         #d>
        <p-header>Business Unit List</p-header>
        <p-column field="tax_Entity" header="Tax Entity"    [sortable]="true"></p-column>
        <p-column field="business_Unit" header="Business Unit" [sortable]="true" item-width="200px"></p-column>
        <p-column field="tax_No" header="Tax No" [sortable]="true"></p-column>
        <p-column field="manager" header="Manager" [sortable]="true"></p-column>
        <p-column field="title" header="Title" [sortable]="true"></p-column>
        <p-column field="address" header="Address" [sortable]="true"></p-column>
        <p-column field="active" header="Active" [sortable]="true" item-width="10px"></p-column>
        <!-- <p-footer>Total Rows:{{totalRecords}} Total Pages:{{totalPages}}</p-footer> -->
    </p-dataTable>


</div>
