<p-dropdown [disabled]="disabled  || !(options && options.length >0)" [style]="{'width':'100%'}" [options]="options" [(ngModel)]="value" (onChange)="onchanged($event)"
  [filter]="(options && options.length >5)">
  <ng-template let-bu pTemplate="item">
    <div>{{bu.label}}</div>
  </ng-template></p-dropdown>
