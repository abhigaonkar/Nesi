<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
  <form [formGroup]="userform" (ngSubmit)="onSubmit(userform.value)">
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right">
        *Business Unit:
      </div>
      <div class="ui-g-12 ui-md-8">
        <nesi-ReactiveDropDown [options]="currentProfile && currentProfile.perDiemBusinessUnitList" formControlName="buId" (onChange)="loadSelectedBuProfile()"></nesi-ReactiveDropDown>
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right">
        *For Employees:
      </div>
      <div class="ui-g-12 ui-md-8">
        <p-multiSelect  [options]="buProfile && buProfile.forEmployees" formControlName="id_member"
        selectedItemsLabel="{0} employees selected"></p-multiSelect>
        <nesi-fieldErrorDisplay [displayError]="isFieldInValid('id_member')" errorMsg="You must select at least one employee."></nesi-fieldErrorDisplay>
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right">
        *Start Date:
      </div>
      <div class="ui-g-12 ui-md-8">
        <p-calendar formControlName="date_start" [minDate]="CalendedrMinDate"  placeholder="yyyy-mm-dd" 
        dateFormat="yy-mm-dd"
        showIcon="true"></p-calendar>
        <nesi-fieldErrorDisplay [displayError]="isFieldInValid('date_start')" errorMsg="Start Date is required"></nesi-fieldErrorDisplay>
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right">
        *End Date:
      </div>
      <div class="ui-g-12 ui-md-8">
        <p-calendar formControlName="date_end" [minDate]="CalendedrMinDate"  
        dateFormat="yy-mm-dd"
        placeholder="yyyy-mm-dd" showIcon="true"></p-calendar>
        <nesi-fieldErrorDisplay [displayError]="isFieldInValid('date_end')" errorMsg="End Date is required"></nesi-fieldErrorDisplay>
        <nesi-fieldErrorDisplay [displayError]="formHasError('EndDateGreatThanStartDate',['date_end','date_start'])" errorMsg="The end date has to be greater than, or equal to the start date."></nesi-fieldErrorDisplay>
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right">
        Rate:
      </div>
      <div class="ui-g-12 ui-md-8">
        <input type="number"  step="0.01" pInputText formControlName="rate" placeholder="Rate">
        <nesi-fieldErrorDisplay [displayError]="isFieldInValid('rate')" errorMsg="Rate is required"></nesi-fieldErrorDisplay>

      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right_nopad">
        Calculated Total:
      </div>
      <div class="ui-g-12 ui-md-8 ">
        ${{ amount }}
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad" *ngIf="allow_unlinked_timesheet">
      <div class="ui-g-12 ui-md-4 label_for_right">
        Job #:
      </div>
      <div class="ui-g-12 ui-md-8">
        <input pInputText formControlName="wo_number" placeholder="Job #">
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad" *ngIf="!allow_unlinked_timesheet">
      <div class="ui-g-12 ui-md-4 label_for_right">
        Work Order #:
      </div>
      <div class="ui-g-12 ui-md-8">
        <p-dropdown [options]="buProfile && buProfile.workOrders" formControlName="wo_number" dataKey="woprog_id" [style]="{'width':'100%'}"
          placeholder="&nbsp;" [filterBy]="'customer_name,woprog_bvwo,description'" [filter]="buProfile && buProfile.workOrders.length>10">
          <ng-template let-wo pTemplate="item">
            <div class="ui-g ui-g-nopad" [ngClass]="{'top_border': cs.isSm}">
              <div class="ui-g-9 ui-lg-3  ui-g-nopad">
                {{wo.customer_name}}
              </div>
              <div class="ui-g-3 ui-lg-2 ui-g-nopad">
                {{wo.woprog_bvwo}}
              </div>
              <div class="ui-g-12 ui-lg-7  ui-g-nopad">
                {{wo.description}}
              </div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right_nopad">
        OR was this a shop expense?:
      </div>
      <div class="ui-g-12 ui-md-8">
        <p-checkbox binary="true" formControlName="isShop" (onChange)="shopChanged($event)"></p-checkbox>
        <nesi-fieldErrorDisplay [displayError]="formHasError('workOrderOrShop',['wo_number','isShop'])" errorMsg="Please either choose a work order, or check the shop expense checkbox."></nesi-fieldErrorDisplay>
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4 label_for_right_nopad">
        WO Line Description:
      </div>
      <div class="ui-g-12 ui-md-8 ">
        {{ woLineDescription }}
      </div>
    </div>
    <div class="ui-g-12 ui-g-lesspad">
      <div class="ui-g-12 ui-md-4">

      </div>
      <div class="ui-g-12 ui-md-8">
        <button pButton type="submit" label="Submit" icon="fa-save"></button>
      </div>
    </div>
  </form>
</div>
