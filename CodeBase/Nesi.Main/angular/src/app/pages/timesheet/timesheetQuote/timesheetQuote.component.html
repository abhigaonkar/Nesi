<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">

  <div class="ui-g-12 ui-g-nopad ui-g-nopad">

    <div class="ui-g-12 ui-md-2 label_for_right">
      Customer Name:
    </div>
    <div class="ui-g-12 ui-md-10">
      <nesi-timesheetWorkOrderCustomer [disabled]="disabled" [URL]="APIURLQuoteCustomerList" [(ngModel)]="selectedCustomer" (OnAfterLoadUrl)="AfterLoadUrl()"
        (onChange)="OnChangeCustomer($event)">

      </nesi-timesheetWorkOrderCustomer>
    </div>
  </div>
  <div class="ui-g-12 ui-g-nopad">
    <div class="ui-g-12 ui-md-2 label_for_right">
      Quote:
    </div>
    <div class="ui-g-12 ui-md-10">
      <nesi-timesheetQuoteQuote [URL]="APIURLQuoteQuoteList" [disabled]="disabled" [(ngModel)]="selectedQuote" (onChange)="OnChangeQuote($event)"></nesi-timesheetQuoteQuote>
    </div>

  </div>
  <div class="ui-g-12 ui-g-nopad">
    <nesi-CompletePercent [(ngModel)]="percentComplete"></nesi-CompletePercent>
  </div>
  <div class="ui-g-12 ui-g-nopad">
    <div class="ui-g-12 ui-md-2 label_for_right">
      How was your day?
    </div>
    <div class="ui-g-12 ui-md-10">
      <p-rating [(ngModel)]="rating" [cancel]="false"></p-rating>
    </div>
  </div>
  <div class="ui-g-12 ui-g-nopad">

    <div class="ui-g-12 ui-md-2 label_for_right">
      Hrs:
    </div>
    <div class="ui-g-12 ui-md-10">
      <input type="number"  step="0.5" pInputText [(ngModel)]="hours" class="inputHrs"  [min]="minvalue" [max]="maxvalue" (change)="onChange($event)" />
    </div>
  </div>
</div>
