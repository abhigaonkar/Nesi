<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
  <nesi-breadcurmb [items]="[{label: 'Personal Emenergcy Leave (PEL) Requests'},{label: tabName}]"></nesi-breadcurmb>
  <nesi-timesheetBarMenu [Profile]="Profile"></nesi-timesheetBarMenu>
  <div class="ui-g-12">
    <p-tabView #d (onChange)="tabChanged($event)">
      <p-tabPanel header="Schedule" [leftIcon]="'fa-calendar-check'">
        <nesi-timesheet-pel-schedule (onChange)="setHistory($event)" (beforeSubmit)="onsubmitting=true" (afterSubmit)="onsubmitting=false"></nesi-timesheet-pel-schedule>
      </p-tabPanel>
      <p-tabPanel header="Past Requests" [leftIcon]="'fa-history'">
        <nesi-timesheet-pel-history (deleted)="onDelete($event)"></nesi-timesheet-pel-history>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>
<p-blockUI [target]="d" [blocked]="onsubmitting">
  <i class="fa fa-spinner  fa-spin fa-2x middlecenter"></i>
</p-blockUI>
