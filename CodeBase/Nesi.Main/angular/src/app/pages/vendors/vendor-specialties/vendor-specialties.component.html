<p-dataTable [value]="profile.list" [responsive]="true" (onRowSelect)="select($event)" rowHover="true" selectionMode="single"
  [(selection)]="selected" dataKey="id"  #d>
  <p-header>
    <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
      <div class="ui-g-12">
        <form [formGroup]="userform" (ngSubmit)="onSubmit(userform.value)">
          <div class="ui-g-12 ui-lg-1">
            Skill:
          </div>
          <div class="ui-g-12 ui-lg-6">
            <input pInputText maxlength="150" formControlName="value">
            <nesi-fieldErrorDisplay [displayError]="isFieldInValid('value')" [errorMsg]="'Skill is required.'"></nesi-fieldErrorDisplay>
          </div>
          <div class="ui-g-12 ui-lg-1">
            <button pButton label="{{selected?'Save':'Add'}}" icon="{{selected?'fa-save':'fa-plus'}}"></button>
          </div>
          <div class="ui-g-12 ui-lg-1">
            <button type="button" (click)="selected=null;submitReset()" pButton label="Cancel" icon="fa-times"></button>
          </div>
        </form>
      </div>
      <div class="ui-g-12 left bold">
          Click to Edit Row
        </div>
    </div>
  </p-header>
  <p-column [style]="{'width':'80px', 'text-align': 'center'}" header="Delete">
    <ng-template let-col let-item="rowData" pTemplate="body">
      <button (click)="delete(item)" pButton icon="fa-times" type="button" class="ui-button-warning"></button>
    </ng-template>
  </p-column>
  <p-column [style]="{'width':'60%'}" field="skill" header="Skill" [sortable]="true"></p-column>
  <p-column [style]="{'width':'10%'}" field="date_added" header="Date Added" [sortable]="true">
     
  </p-column>
  <p-column [style]="{'width':'20%'}" field="added_by_name" header="Added By" [sortable]="true"></p-column>
</p-dataTable>
