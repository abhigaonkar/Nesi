<div class="ui-inputgroup">
    
      <span class="ui-float-label ">
        <p-autoComplete [size]="30" id="float-input" [(ngModel)]="text" [suggestions]="allitems" (completeMethod)="search($event)" (onSelect)="select($event)"
          dataKey="value" field="label"></p-autoComplete>
        <label for="float-input">{{placeholder}}</label>
      </span>
      <span class="ui-inputgroup-addon">
        <i class="fa fa-search"></i>
      </span>
    </div>
