<div class="ui-g-10 ui-g-nopad">
  <nesi-ReactiveDropDown [placeholder]="placeholder" [options]="allitems" [(ngModel)]="selectItem" (onChange)="select($event)"></nesi-ReactiveDropDown>
</div>
<div class="ui-g-2 ui-g-nopad">
  <div class="ui-g-6 ui-g-nopad">
    <button pButton [disabled]="!selectItem" icon="fa-window" (click)="select({value: selectItem})"></button>
  </div>
  <div class="ui-g-6 ui-g-nopad right">
    <button pButton icon="fa-times" class="ui-button-danger" (click)="close.emit()"></button>
  </div>
</div>
<p-blockUI [blocked]="submitting">
  <i class="fa fa-spinner fa-spin fa-3x nesi-block-50"></i>
</p-blockUI>

<p-dialog header="{{sourceName}}: {{label}}" [minWidth]="cs.isLg? '1024': '0'" [modal]="true" [responsive]="true" [(visible)]="dialogDisplay">
  <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid">
    <form [formGroup]="userform" (ngSubmit)="onSubmit(userform.value)">
      <div class="ui-g-4 ui-md-offset-2" style="margin-top: 5px">
        <b>Cost Price for each kitted:
          <i *ngIf="cost_count>0" class="fa fa-spinner fa-spin fa-fw"></i>
          <span *ngIf="cost_count==0" class="larger">{{cost_sum | currency:'CAD':'symbol-narrow':'1.2-2' }}</span>
        </b>
      </div>
      <div class="ui-g-2 ui-md-1">
        <input id="_amount" pInputText type="number" formControlName="qty">
      </div>
      <div class="ui-g-3">
        <button pButton icon="fa-plus" label="Add" [disabled]="cost_count>0"></button>
      </div>
      <ng-container formArrayName="rows">
        <div *ngFor="let row of rows.controls; let i=index">
          <div class="ui-g-12 hoverrow" [formGroupName]="i" [ngClass]="{'greyBack': i % 2==1,'whiteBack': i %2 ==0}">
            <div class="ui-g-1">
              {{i+1}}
            </div>
            <div class="ui-g-8">
              <nesi-picklist-selectItem (startLoad)="costStart()" (loaded)="costLoaded($event,i)" [quote_id]="quote_id" [revision]="revision"
                [item]="row.value"></nesi-picklist-selectItem>
            </div>
            <!-- <div class="ui-g-8">
            <div>Cost: {{row.value.chargeout | currency:'CAD':'symbol-narrow':'1.2-2' }}</div>
          </div> -->
            <div class="ui-g-2">
              <input readonly="true" id="qty" pInputText type="number" step="1" formControlName="qty">
            </div>
          </div>
        </div>
      </ng-container>
    </form>
  </div>
</p-dialog>
