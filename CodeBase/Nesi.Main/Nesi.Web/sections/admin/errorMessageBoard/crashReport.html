<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="//code.jquery.com/ui/1.11.4/themes/smoothness/jquery-ui.css">

  <style type="text/css">

      font-size: 24px;

    thead{

      font-size: 45px;

    .global{
      color: red;

  <script type="text/javascript">
//http://jordan.nesi.ca/sections/admin/errorMessageBoard/errorMessageData.asmx/getInfo
  $(document).ready(function(){





var oldTime = 0;
var queueMemberTime = [];
var queueWoTime = [];
var neMemberTimeAvg = "...";
var neWoProgTimeAvg = "...";

var array = [];
var errorsHtml = "";
var errorsHtmlOld = "";

window.setInterval(function(){
//Android.stopLoad();
//Android.showLoad("Get");
  
 $.ajax({
  type: "POST",
  data: "data",
  dataType: "xml",
  url: "/sections/admin/errorMessageBoard/errorMessageData.asmx/getMostError",
  crossDomain: true,
  success: function(xml){
          $(xml).find("ErrorLogData").each(function()
          {
              var one = $(this).find("errorDesc").text();
              var host = $(this).find("host").text();
              var member = $(this).find("member").text();


              var errorsToday = $(this).find("errorsToday").text();
              var criticalTickets = $(this).find("criticalTickets").text();
              var errorCount = $(this).find("errorCount").text();
              var randomTicket = $(this).find("randomTicket").text();
              var isGlobal = $(this).find("isGlobal").text();


              $("#crashCount").html(errorsToday);
              globalClass = "";
                if (isGlobal == "1"){
                    globalClass = "global";
                }

                errorsHtml += "<tr class='first "+globalClass+" ' ><td>Count:<strong>" +  errorCount + "</strong></td><td>Host:<strong>"+ host + "</strong></td> <td>Member:<strong>"+ member + "</strong></td> </tr>";
                errorsHtml += "<tr class='"+globalClass+"' > <td colspan='3'> " + one +"</td> </tr>";
          });
          
        
  }
 });
//checkServerStatus( "https://www.nesi.ca" );
//checkServerStatus( "https://beta.nesi.ca" );

if (errorsHtml == errorsHtmlOld){
  errorsHtml = "";
}else{

$("#crashReports").html(errorsHtml).fadeIn();
errorsHtmlOld = errorsHtml;
errorsHtml = "";

}



            //  Android.showToast("Errorzzz", 250);
}, 3000);


});
