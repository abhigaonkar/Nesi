{
    var script = document.body.appendChild(document.createElement("script"));
    script.onerror = function()
    {
        $("<div ><strong><mark>"+url+" IS DOWN!</mark> "+Date()+" </strong><hr></div>").hide().prependTo("#output").slideDown(1000).effect("highlight", {color: 'red'}, 800).effect("highlight", {color: 'red'}, 200).effect("highlight", {color: 'red'}, 500);
